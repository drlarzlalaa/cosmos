<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSMOS — Research Library</title>
<link rel="stylesheet" href="/shared/style.css">
<style>
.badge { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .03em; border-radius: 999px; padding: 3px 10px; }
.badge.established { background: rgba(0,200,150,.15); color: #00c896; }
.badge.open_question { background: rgba(106,166,255,.15); color: var(--accent); }
.badge.speculative { background: rgba(255,106,106,.15); color: var(--danger); }
.source { border-bottom: 1px solid var(--border); padding: 16px 0; }
.source:last-child { border-bottom: none; }
.source h3 { margin: 6px 0 4px; }
.source .meta { font-size: 12.5px; }
textarea { width: 100%; padding: 10px 12px; margin: 6px 0 14px; background: #0d1220; color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; min-height: 90px; }
select { width: 100%; padding: 10px 12px; margin: 6px 0 14px; background: #0d1220; color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <strong>COSMOS</strong>
    <a href="/dashboard/">&larr; Back to dashboard</a>
  </nav>

  <div class="panel">
    <h2>Research library</h2>
    <p class="muted">
      Every entry here is tagged <span class="badge established">established</span>,
      <span class="badge open_question">open question</span>, or
      <span class="badge speculative">speculative</span> - never left to imply more
      confidence than the evidence supports.
    </p>
    <input id="search-box" type="text" placeholder="Search by title or abstract…">
    <div id="results"></div>
  </div>

  <div class="panel" id="add-panel" style="margin-top:18px;display:none">
    <h2>Add a source</h2>
    <input id="src-title" type="text" placeholder="title">
    <input id="src-url" type="text" placeholder="url (optional)">
    <input id="src-authors" type="text" placeholder="authors (optional)">
    <textarea id="src-abstract" placeholder="abstract"></textarea>
    <select id="src-evidence">
      <option value="established">established</option>
      <option value="open_question">open question</option>
      <option value="speculative">speculative</option>
    </select>
    <div class="error" id="add-error"></div>
    <button id="add-submit">Add source</button>
  </div>
  <p class="muted" id="signed-out-note" style="display:none">
    <a href="/login/">Sign in</a> to add a source.
  </p>
</div>
<script type="module" src="library.js"></script>
</body>
</html>
