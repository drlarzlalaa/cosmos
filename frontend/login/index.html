<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSMOS — Sign in</title>
<link rel="stylesheet" href="/shared/style.css">
</head>
<body>
<div class="wrap" style="max-width:420px;padding-top:80px">
  <div class="panel">
    <h1>COSMOS</h1>
    <p class="muted">Universal Law Discovery System — Phase 1: accounts</p>

    <div id="login-view">
      <h2>Sign in</h2>
      <input id="login-email" type="email" placeholder="email">
      <input id="login-password" type="password" placeholder="password">
      <div class="error" id="login-error"></div>
      <button id="login-submit">Sign in</button>
      <p class="muted">No account? <a href="#" id="show-register">Create one</a></p>
    </div>

    <div id="register-view" style="display:none">
      <h2>Create account</h2>
      <input id="register-name" type="text" placeholder="display name">
      <input id="register-email" type="email" placeholder="email">
      <input id="register-password" type="password" placeholder="password (8+ characters)">
      <div class="error" id="register-error"></div>
      <button id="register-submit">Create account</button>
      <p class="muted">Already have one? <a href="#" id="show-login">Sign in</a></p>
    </div>
  </div>
</div>
<script type="module" src="login.js"></script>
</body>
</html>
